<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TRACKER_TITLE__</title>
<style>
/*__TRACKER_STYLE__*/
/* A tracker's page, built by `tracker.py build` next to its JSON file, with
   the tracker embedded below. It opens from disk with no server and loads
   nothing from the network; replies typed here stay in this browser until
   they are copied to the agent. One reading column, the sheet the hub draws
   for a tracker: its name on a tab, then the stages and the items of the open
   one, each a row that opens onto its detail and a reply box. */
.wrap { max-width: 860px; margin: 0 auto; padding: 32px 20px 96px; }
.lede { white-space: pre-line; }
details.item > summary { list-style: none; }
details.item > summary::-webkit-details-marker { display: none; }
details.item[open] { background: var(--paper); border-radius: var(--radius); }
details.item[open] > summary:hover { background: transparent; }
details.item .detail { padding: 4px 12px 16px 33px; }
details.item .detail textarea { background: var(--surface); }
.newbox { margin-top: 32px; }
.newbox p { color: var(--muted); font-size: var(--t-s); margin: 4px 0 8px; }
.outbox { position: sticky; bottom: 16px; margin-top: 28px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  background: var(--ink); color: var(--paper); border-radius: var(--radius-lg); padding: 8px 8px 8px 16px; }
.outbox .btn { background: var(--paper); color: var(--ink); border-color: var(--paper); margin-left: auto; }
.outbox textarea { flex-basis: 100%; min-height: 120px; }
.foot { margin-top: 32px; color: var(--muted); font-size: var(--t-s); }
@media (max-width: 560px) { .wrap { padding-top: 24px; } .row .where { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="leaves"><h1 class="leaf only" id="title">Tracker</h1></div>
  <div class="sheet">
    <div class="about" id="about"><p class="lede" id="lede"></p></div>
    <div class="tabs" id="tabs" role="tablist" aria-label="Status"></div>
    <div id="list"><p class="empty">Loading the tracker…</p></div>
  </div>
  <section class="newbox" id="newbox" hidden></section>
  <div class="outbox" id="outbox" hidden></div>
  <p class="foot" id="foot"></p>
</div>
<script type="application/json" id="tracker-data">__TRACKER_DATA__</script>

<script>
const STATUS = { draft: "Draft", todo: "To do", doing: "In progress", done: "Done", dropped: "Not doing" };
/* Needs you filters To do and In progress; the stages keep the one order they
   are ever shown in. The hub has the same tabs. */
const NEEDS = "needs";
const STAGES = [["draft", "Draft"], ["todo", "To do"], ["doing", "In progress"], ["archive", "Archive"]];
const closed = (it) => it.status === "done" || it.status === "dropped";
const needsYou = (it) => (it.status === "todo" || it.status === "doing") && (it.for === "me" || (!!it.question && !it.unread));
const stageOf = (it) => closed(it) ? "archive" : it.status;
const inTab = (it, k) => k === NEEDS ? needsYou(it) : stageOf(it) === k;
const closedAt = (it) => it.closed || it.updated || it.created || "";
const NEW = "new";         // tracker.py turns "[new] …" into a new item

let state = null, source = "", tab = "";
try { tab = localStorage.getItem("trackerTab") || ""; } catch (e) {}
/* Replies typed here and not yet seen in the rebuilt tracker. They live in
   this browser only (keyed by this file's path) and leave it only when
   copied to the agent. */
const DRAFT_KEY = "tracker-drafts:" + location.pathname;
let drafts = {};           // item id -> {text}; NEW -> the owner's new items
try { drafts = JSON.parse(localStorage.getItem(DRAFT_KEY) || "{}") || {}; } catch (e) {}
const saveDrafts = () => { try { localStorage.setItem(DRAFT_KEY, JSON.stringify(drafts)); } catch (e) {} };

const $ = (id) => document.getElementById(id);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(c));
  return n;
};
const when = (iso) => { const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }); };
const items = () => (state && state.items) || [];
const said = (it) => (it.context || it.title || "").trim();
const newParts = () => ((drafts[NEW] || {}).text || "").split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean);
const ownerSaid = (it, text) => (it.thread || []).some((m) => m.by === "owner" && m.text.trim() === text);

/* A typed reply is done with once the rebuilt tracker carries it. */
function forgetMerged() {
  const byId = Object.fromEntries(items().map((i) => [i.id, i]));
  for (const [id, d] of Object.entries(drafts)) {
    if (id === NEW) continue;
    const text = (d.text || "").trim();
    if (!byId[id] || !text || ownerSaid(byId[id], text)) delete drafts[id];
  }
  const left = newParts().filter((p) => !items().some((i) => said(i) === p));
  if (left.length) drafts[NEW] = { text: left.join("\n\n") }; else delete drafts[NEW];
  saveDrafts();
}
const ready = () => items().filter((i) => drafts[i.id] && drafts[i.id].text.trim());

/* The tab to show: the one picked, else what needs the owner, else the first with items. */
function openTab() {
  const has = (k) => items().some((i) => inTab(i, k));
  return has(tab) ? tab : has(NEEDS) ? NEEDS : (STAGES.find(([k]) => has(k)) || [""])[0];
}

function renderHead() {
  document.title = state.title || "Tracker";
  $("title").textContent = state.title || "Tracker";
  $("lede").textContent = state.summary || "";
  $("about").hidden = !state.summary;
  const count = (k) => items().filter((i) => inTab(i, k)).length;
  const open = openTab();
  const pick = (k) => { tab = k; try { localStorage.setItem("trackerTab", k); } catch (e) {} render(); };
  const tabEl = ([k, label]) => el("button", { type: "button", class: k === NEEDS ? "tab filter" : "tab", role: "tab", "aria-selected": String(k === open),
      title: k === NEEDS ? "Not a stage: everything in To do or In progress that is waiting for you" : null, onclick: () => pick(k) },
    k === NEEDS ? el("span", { class: "flag needs" }, label, el("span", { class: "n" }, String(count(k))))
      : [label, el("span", { class: "n" }, String(count(k)))]);
  $("tabs").replaceChildren(...(count(NEEDS) ? [tabEl([NEEDS, "Needs you"]), el("span", { class: "tab-gap" })] : []),
    ...STAGES.filter(([k]) => count(k)).map(tabEl));
  const last = items().map((i) => i.updated || "").sort().pop();
  $("foot").textContent = `Built from ${source}` + (last ? `, last changed ${last}` : "") + ". The agent rebuilds this page after every change: reload to see it.";
}

function section(label, text, cls = "") {
  return text ? el("div", { class: cls }, el("div", { class: "lbl" }, label), el("p", { class: "text" }, text)) : null;
}

function replyBox(it) {
  const ta = el("textarea", { id: "reply-" + it.id, "aria-label": "Reply about " + it.title,
    placeholder: needsYou(it) ? "Your answer" : "Reply",
    oninput: (e) => {
      if (e.target.value.trim()) drafts[it.id] = { text: e.target.value }; else delete drafts[it.id];
      saveDrafts(); renderOutbox();
    } });
  ta.value = (drafts[it.id] || {}).text || "";
  return ta;
}

function detail(it) {
  const thread = (it.thread || []).map((m) => el("div", { class: "msg " + m.by },
    el("span", { class: "who" }, (m.by === "owner" ? "You" : "Agent") + ", " + when(m.at)), m.text));
  const table = it.table && it.table.length ? el("div", { class: "tw" }, el("table", { class: "mini" },
    el("tr", {}, ...it.table[0].map((c) => el("th", {}, String(c)))),
    ...it.table.slice(1).map((r) => el("tr", {}, ...r.map((c) => el("td", {}, String(c))))))) : null;
  return el("div", { class: "detail" },
    section("Context", it.context), table, section("Plan", it.plan),
    section(needsYou(it) ? "Question for you" : "You were asked", it.question, needsYou(it) ? "question" : ""),
    section("Decided", it.decision),
    section(it.status === "dropped" ? "Why not" : it.status === "done" ? "What was done" : "Progress", it.outcome),
    (it.refs || []).length ? el("p", { class: "refs" }, it.refs.join(", ")) : null,
    thread.length ? el("div", { class: "thread" }, thread) : null,
    it.for === "me" ? null : replyBox(it));
}

function itemEl(it) {
  const open = needsYou(it) || !!drafts[it.id];
  return el("details", { class: "item", id: it.id, open },
    el("summary", { class: "row " + it.status },
      el("span", { class: "dot " + it.status, title: STATUS[it.status] }),
      el("span", { class: "title" }, it.title),
      it.for === "me" ? el("span", { class: "flag me" }, "Yours") : null,
      openTab() === NEEDS ? el("span", { class: "flag" }, STATUS[it.status]) : needsYou(it) && it.for !== "me" ? el("span", { class: "flag needs" }, "Needs you") : null,
      it.status === "dropped" ? el("span", { class: "flag" }, STATUS.dropped) : null,
      el("span", { class: "where" }, it.id)),
    detail(it));
}

function newBox() {
  const ta = el("textarea", { id: "reply-" + NEW, "aria-label": "New items for the agent", placeholder: "One item per paragraph",
    oninput: (e) => {
      if (e.target.value.trim()) drafts[NEW] = { text: e.target.value }; else delete drafts[NEW];
      saveDrafts(); renderOutbox();
    } });
  ta.value = (drafts[NEW] || {}).text || "";
  $("newbox").replaceChildren(el("h2", {}, "Something new?"),
    el("p", {}, "A task, a bug or an idea. Leave a blank line between items."), ta);
  $("newbox").hidden = false;
}

function copyText() {
  const blocks = ready().map((i) => `[${i.id}] ${drafts[i.id].text.trim()}`).concat(newParts().map((p) => `[${NEW}] ${p}`));
  // Starts with the skill's command, so the agent loads the tracker skill at once.
  return `/tracker Replies to ${state.title} (${source}):\n\n` + blocks.join("\n\n") + "\n";
}

async function copy() {
  const text = copyText();
  try { await navigator.clipboard.writeText(text); $("outbox-note").textContent = "Copied. Paste it to the agent."; return; } catch (e) {}
  const ta = el("textarea", { readonly: true, "aria-label": "Replies to copy" }); ta.value = text;
  $("outbox").append(ta); ta.select();
  $("outbox-note").textContent = "Copying was blocked: copy the text below.";
}

function renderOutbox() {
  const n = ready().length, k = newParts().length;
  $("outbox").hidden = !(n + k);
  if (!(n + k)) return;
  const what = [n ? `${n} ${n === 1 ? "reply" : "replies"}` : "", k ? `${k} new ${k === 1 ? "item" : "items"}` : ""].filter(Boolean).join(" and ");
  $("outbox").replaceChildren(el("span", { id: "outbox-note" }, `${what} for the agent`),
    el("button", { type: "button", class: "btn", onclick: copy }, "Copy for the agent"));
}

function render() {
  if (!state) return;
  renderHead(); renderOutbox();
  const focused = document.activeElement && document.activeElement.id;
  const caret = focused && document.activeElement.selectionStart;
  const open = openTab();
  const rows = items().filter((i) => inTab(i, open));
  if (open === "archive") rows.sort((a, b) => closedAt(b).localeCompare(closedAt(a)));   // newest first
  $("list").replaceChildren(rows.length ? el("div", { class: "items" }, rows.map(itemEl)) : el("p", { class: "empty" }, "No items yet."));
  if (focused) { const f = document.getElementById(focused); if (f) { f.focus(); try { f.setSelectionRange(caret, caret); } catch (e) {} } }
}

try {
  const data = JSON.parse($("tracker-data").textContent);
  state = data.tracker; source = data.source || "the tracker file";
  forgetMerged(); newBox(); render();
} catch (e) {
  $("list").replaceChildren(el("p", { class: "empty" }, "This is the template. Open the page that `tracker.py build` writes next to a tracker."));
}
</script>
</body>
</html>
